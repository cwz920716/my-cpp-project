name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu GCC
            os: ubuntu-24.04
            cxx: g++
          - name: Ubuntu Clang
            os: ubuntu-24.04
            cxx: clang++
          - name: macOS AppleClang
            os: macos-latest
            cxx: clang++
          - name: Windows MSVC
            os: windows-latest
            cxx: ""

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        shell: bash
        env:
          CXX: ${{ matrix.cxx }}
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
